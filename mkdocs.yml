site_name: PyWeb
site_url: https://robcox2910.github.io/pyweb/
site_description: "Build your own web server in Python: HTTP parsing, routing, templates and static files on top of PyNet, explained for learners."
repo_url: https://github.com/robcox2910/pyweb
repo_name: robcox2910/pyweb

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - The Async Server: concepts/async-server.md
  - Caching: concepts/caching.md
  - Cookies and Sessions: concepts/cookies-and-sessions.md
  - CSRF Protection: concepts/csrf.md
  - Escaping: concepts/escaping.md
  - Handlers and Threads: concepts/handlers-and-threads.md
  - Keep-Alive: concepts/keep-alive.md
  - Limits and Timeouts: concepts/limits-and-timeouts.md
  - Middleware: concepts/middleware.md
  - Passwords: concepts/passwords.md
  - Requests: concepts/requests.md
  - Responses: concepts/responses.md
  - Roles: concepts/roles.md
  - Routing: concepts/routing.md
  - Server-Sent Events: concepts/server-sent-events.md
  - Server: concepts/server.md
  - Templates: concepts/templates.md
  - Testing Apps: concepts/testing-apps.md
  - WebSockets in PyWeb: concepts/websockets-in-pyweb.md
  - Property Testing: property-testing.md
  # series-nav:start
